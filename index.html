<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Dinheiros</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dinheiros">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#0b0b0d; --surface:#161418; --surfaceAlt:#1d1a20; --border:#2b2730;
    --yellow:#F4E409; --pink:#EC1A8C; --white:#F5F5F0; --gray:#8d8894; --red:#FF5A5A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html{ height:100%; }
  body{
    margin:0; padding:0; background:var(--bg); color:var(--white); font-family:'Inter',sans-serif;
    min-height:100vh; min-height:100dvh; overscroll-behavior-y:contain; -webkit-font-smoothing:antialiased;
  }
  button, .oswald, .at-btn { -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  input, select, textarea { font-size:16px; } /* impede zoom automático no iOS ao focar */
  .oswald{ font-family:'Oswald',sans-serif; letter-spacing:.08em; text-transform:uppercase; }
  .playfair{ font-family:'Playfair Display',serif; }
  input, select, button{ font-family:'Inter',sans-serif; }
  ::-webkit-scrollbar{ height:6px; width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  .at-btn{ cursor:pointer; border:none; transition:transform .12s ease, filter .12s ease; }
  .at-btn:hover{ filter:brightness(1.08); }
  .at-btn:active{ transform:scale(0.96); }
  .row-hover:active{ background:var(--surfaceAlt); }
  .grid4{ display:grid; grid-template-columns:1.3fr 1fr 1fr 1fr; gap:14px; }
  .rowgrid{ display:grid; grid-template-columns:70px 1fr 100px 100px 110px 32px; align-items:center; }
  .app-header{ position:sticky; top:0; z-index:30; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .fab{
    position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom));
    width:58px; height:58px; border-radius:50%; background:var(--pink); color:#fff;
    display:flex; align-items:center; justify-content:center; z-index:40;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
  }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    background:var(--surface); border:1px solid var(--border); border-bottom:none;
    width:100%; max-width:460px; padding:14px 24px calc(24px + env(safe-area-inset-bottom));
    border-radius:20px 20px 0 0; max-height:88vh; overflow-y:auto;
    animation:slideUp .28s cubic-bezier(.32,.72,0,1);
  }
  .sheet-handle{ width:36px; height:4px; border-radius:2px; background:var(--border); margin:0 auto 16px; }
  @keyframes slideUp{ from{ transform:translateY(40px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  @media (min-width:600px){
    .modal-overlay{ align-items:center; padding:20px; }
    .modal-sheet{ border-radius:16px; border-bottom:1px solid var(--border); padding:24px; max-height:none; animation:none; }
    .sheet-handle{ display:none; }
  }
  @media (max-width:720px){
    .grid4{ grid-template-columns:1fr 1fr; }
    .rowgrid{ grid-template-columns:56px 1fr 90px 32px; }
    .hide-mobile{ display:none !important; }
  }
</style>
</head>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const COLORS = {
  bg:"#0b0b0d", surface:"#161418", surfaceAlt:"#1d1a20", border:"#2b2730",
  yellow:"#F4E409", pink:"#EC1A8C", white:"#F5F5F0", gray:"#8d8894", red:"#FF5A5A",
};
const DEFAULT_THEME = { accent1: COLORS.yellow, accent2: COLORS.pink };
const THEME_PRESETS = [
  { id: "alltoral", name: "ALLTORAL Original", accent1: "#F4E409", accent2: "#EC1A8C" },
  { id: "verde-roxo", name: "Verde & Roxo", accent1: "#4ADE80", accent2: "#A855F7" },
  { id: "azul-laranja", name: "Azul & Laranja", accent1: "#38BDF8", accent2: "#FB923C" },
  { id: "vermelho-ciano", name: "Vermelho & Ciano", accent1: "#FF4D6D", accent2: "#22D3EE" },
  { id: "ouro-lima", name: "Ouro & Lima", accent1: "#FFD700", accent2: "#B4F42A" },
];
const MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtMoney = (v) => (v<0?"-R$ ":"R$ ") + Math.abs(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid = () => Math.random().toString(36).slice(2,10);

// --- simple inline icons (no external icon lib needed) ---
const Icon = ({ path, size=16, color="currentColor" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d={path} />
  </svg>
);
const IconPlus = (p) => <Icon {...p} path="M12 5v14M5 12h14" />;
const IconTrash = (p) => <Icon {...p} path="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" />;
const IconRepeat = (p) => <Icon {...p} path="M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3" />;
const IconUp = (p) => <Icon {...p} path="M23 6l-9.5 9.5-5-5L1 18" />;
const IconDown = (p) => <Icon {...p} path="M23 18l-9.5-9.5-5 5L1 6" />;
const IconWallet = (p) => <Icon {...p} path="M21 12V7H5a2 2 0 0 1 0-4h14v4M3 5v14a2 2 0 0 0 2 2h16v-5M18 12a1 1 0 1 0 0 2 1 1 0 0 0 0-2z" />;
const IconLeft = (p) => <Icon {...p} path="M15 18l-6-6 6-6" />;
const IconRight = (p) => <Icon {...p} path="M9 18l6-6-6-6" />;
const IconX = (p) => <Icon {...p} path="M18 6L6 18M6 6l12 12" />;
const IconReset = (p) => <Icon {...p} path="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" />;
const IconPalette = ({ size=16, color="currentColor" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M12 2a10 10 0 1 0 10 10c0-1.1-.9-2-2-2h-2.6a2.4 2.4 0 0 1 0-4.8h.4a2 2 0 0 0 2-2c0-.6-.3-1.2-.7-1.6A9.96 9.96 0 0 0 12 2z" />
    <circle cx="7.5" cy="10.5" r="1.1" fill={color} stroke="none" />
    <circle cx="10.5" cy="7" r="1.1" fill={color} stroke="none" />
    <circle cx="15" cy="7.5" r="1.1" fill={color} stroke="none" />
  </svg>
);

function expandTransactions(transactions){
  const all = [];
  transactions.forEach((t) => {
    if(!t.recurring){ all.push({...t, key:t.id, date:t.date}); return; }
    const [y,m,d] = t.date.split("-").map(Number);
    const months = t.repeatMonths || 12;
    for(let i=0;i<months;i++){
      const dt = new Date(y, m-1+i, d);
      all.push({...t, key:`${t.id}-${i}`, date:`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`});
    }
  });
  return all.sort((a,b)=> a.date.localeCompare(b.date) || a.key.localeCompare(b.key));
}

// --- lightweight dependency-free line chart ---
function BalanceChart({ data, colorAccent1, colorAccent2 }){
  const width = 900, height = 220, padL = 50, padR = 20, padT = 15, padB = 25;
  if(!data.length) return <div style={{padding:30,color:COLORS.gray,fontSize:13,textAlign:"center"}}>Sem dados para mostrar ainda.</div>;

  const values = data.map(d => d.saldo);
  const min = Math.min(0, ...values), max = Math.max(0, ...values);
  const range = (max - min) || 1;
  const innerW = width - padL - padR, innerH = height - padT - padB;

  const x = (i) => padL + (i/(data.length-1 || 1)) * innerW;
  const y = (v) => padT + innerH - ((v - min)/range) * innerH;

  const todayIdx = data.findIndex(d => d.date >= todayISO());
  const splitIdx = todayIdx === -1 ? data.length - 1 : todayIdx;

  const pathFor = (from, to) => {
    if(to - from < 1) return "";
    let d = `M ${x(from)} ${y(data[from].saldo)}`;
    for(let i=from+1;i<=to;i++) d += ` L ${x(i)} ${y(data[i].saldo)}`;
    return d;
  };
  const realPath = pathFor(0, splitIdx);
  const projPath = pathFor(splitIdx, data.length - 1);
  const zeroY = y(0);

  const [hover, setHover] = useState(null);

  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{width:"100%", height:220, display:"block"}}
      onMouseMove={(e)=>{
        const rect = e.currentTarget.getBoundingClientRect();
        const px = (e.clientX-rect.left)/rect.width*width;
        const idx = Math.round(((px-padL)/innerW)*(data.length-1));
        if(idx>=0 && idx<data.length) setHover(idx);
      }}
      onMouseLeave={()=>setHover(null)}
    >
      {[0,0.25,0.5,0.75,1].map((f,i)=>(
        <line key={i} x1={padL} x2={width-padR} y1={padT+f*innerH} y2={padT+f*innerH} stroke={COLORS.border} strokeDasharray="3 3" />
      ))}
      <line x1={padL} x2={width-padR} y1={zeroY} y2={zeroY} stroke={COLORS.red} strokeDasharray="4 4" />
      <path d={realPath} stroke={colorAccent1} strokeWidth="2.5" fill="none" />
      <path d={projPath} stroke={colorAccent2} strokeWidth="2.5" strokeDasharray="6 4" fill="none" />
      {[min, (min+max)/2, max].map((v,i)=>(
        <text key={i} x={4} y={y(v)+4} fontSize="10" fill={COLORS.gray}>{(v/1000).toFixed(1)}k</text>
      ))}
      {hover!=null && (
        <>
          <line x1={x(hover)} x2={x(hover)} y1={padT} y2={height-padB} stroke={COLORS.gray} strokeDasharray="2 2" />
          <circle cx={x(hover)} cy={y(data[hover].saldo)} r="4" fill={hover<=splitIdx?colorAccent1:colorAccent2} />
          <text x={Math.min(x(hover)+8, width-150)} y={padT+14} fontSize="11" fill={COLORS.white}>
            {data[hover].date.split("-").reverse().join("/")} · {fmtMoney(data[hover].saldo)}
          </text>
        </>
      )}
    </svg>
  );
}

function App(){
  const [user, setUser] = useState(undefined); // undefined = ainda checando, null = deslogado
  const [authError, setAuthError] = useState(null);
  const [transactions, setTransactions] = useState([]);
  const [initialBalance, setInitialBalance] = useState(0);
  const [theme, setTheme] = useState(DEFAULT_THEME);
  const [showThemeModal, setShowThemeModal] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [syncError, setSyncError] = useState(false);
  const [cursor, setCursor] = useState(() => {
    const n = new Date();
    return { year: n.getFullYear(), month: n.getMonth() };
  });
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ date: todayISO(), desc:"", type:"entrada", amount:"", recurring:false, repeatMonths:12 });

  useEffect(() => {
    const unsub = window.__auth.onAuthStateChanged((u) => setUser(u || null));
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!user) { setLoaded(false); return; }
    const ref = window.__db.collection("alltoral-fin").doc(user.uid);
    const unsub = ref.onSnapshot(
      (snap) => {
        const d = snap.exists ? snap.data() : {};
        setTransactions(d.transactions || []);
        setInitialBalance(d.initialBalance || 0);
        setTheme(d.theme || DEFAULT_THEME);
        setLoaded(true);
        setSyncError(false);
      },
      (err) => { console.error(err); setSyncError(true); setLoaded(true); }
    );
    return () => unsub();
  }, [user]);

  useEffect(() => {
    document.documentElement.style.setProperty("--yellow", theme.accent1);
    document.documentElement.style.setProperty("--pink", theme.accent2);
  }, [theme]);

  function persist(newTx, newBal){
    if (!user) return;
    window.__db.collection("alltoral-fin").doc(user.uid)
      .set({ transactions: newTx, initialBalance: newBal }, { merge: true })
      .catch((e) => { console.error(e); setSyncError(true); });
  }

  function persistTheme(newTheme){
    if (!user) return;
    window.__db.collection("alltoral-fin").doc(user.uid)
      .set({ theme: newTheme }, { merge: true })
      .catch((e) => { console.error(e); setSyncError(true); });
  }

  function applyTheme(newTheme){
    setTheme(newTheme);
    persistTheme(newTheme);
  }

  function signIn(){
    setAuthError(null);
    window.__auth.signInWithPopup(window.__googleProvider).catch((e) => {
      console.error(e);
      setAuthError("Não deu pra entrar. Tente de novo (verifique se pop-ups estão liberados).");
    });
  }
  function signOut(){ window.__auth.signOut(); }

  const expanded = useMemo(() => expandTransactions(transactions), [transactions]);
  const withBalance = useMemo(() => {
    let running = initialBalance;
    return expanded.map((t) => {
      running += t.type === "entrada" ? t.amount : -t.amount;
      return { ...t, saldo: running };
    });
  }, [expanded, initialBalance]);

  const today = todayISO();
  const currentBalance = useMemo(() => {
    const past = withBalance.filter(t => t.date <= today);
    return past.length ? past[past.length-1].saldo : initialBalance;
  }, [withBalance, today, initialBalance]);

  const projected30 = useMemo(() => {
    const limit = new Date(); limit.setDate(limit.getDate()+30);
    const limitISO = limit.toISOString().slice(0,10);
    const upto = withBalance.filter(t => t.date <= limitISO);
    return upto.length ? upto[upto.length-1].saldo : currentBalance;
  }, [withBalance, currentBalance]);

  const monthLabel = `${MONTHS[cursor.month]} ${cursor.year}`;
  const monthPrefix = `${cursor.year}-${String(cursor.month+1).padStart(2,"0")}`;
  const monthRows = useMemo(() => withBalance.filter(t => t.date.startsWith(monthPrefix)), [withBalance, monthPrefix]);
  const monthTotals = useMemo(() => {
    let entrada=0, saida=0;
    monthRows.forEach(t => t.type==="entrada" ? entrada+=t.amount : saida+=t.amount);
    return { entrada, saida, saldoFinal: monthRows.length ? monthRows[monthRows.length-1].saldo : null };
  }, [monthRows]);

  function addTransaction(){
    const amount = parseFloat(String(form.amount).replace(",", "."));
    if(!form.desc.trim() || !amount || amount<=0 || !form.date) return;
    const newTx = [...transactions, {
      id: uid(), date: form.date, desc: form.desc.trim(), type: form.type, amount,
      recurring: form.recurring, repeatMonths: form.recurring ? (Number(form.repeatMonths)||12) : 1,
    }];
    setTransactions(newTx);
    persist(newTx, initialBalance);
    setForm({ date: todayISO(), desc:"", type:"entrada", amount:"", recurring:false, repeatMonths:12 });
    setShowForm(false);
  }
  function removeTransaction(id){
    const newTx = transactions.filter(t => t.id !== id);
    setTransactions(newTx);
    persist(newTx, initialBalance);
  }
  function updateInitialBalance(val){
    setInitialBalance(val);
    persist(transactions, val);
  }
  function changeMonth(delta){
    setCursor(c => {
      let m=c.month+delta, y=c.year;
      if(m<0){ m=11; y-=1; } if(m>11){ m=0; y+=1; }
      return { year:y, month:m };
    });
  }
  function resetAll(){
    if(!window.confirm("Isso vai apagar todos os lançamentos salvos em todos os dispositivos. Continuar?")) return;
    setTransactions([]); setInitialBalance(0);
    persist([], 0);
  }

  if (user === undefined) {
    return (
      <div style={{ background:COLORS.bg, minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:COLORS.gray, fontSize:13 }}>
        Carregando...
      </div>
    );
  }

  if (user === null) {
    return (
      <div style={{ background:COLORS.bg, minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:20 }}>
        <div className="oswald" style={{ fontSize:26, fontWeight:700, marginBottom:6 }}>
          DINHEIROS
        </div>
        <div className="oswald" style={{ fontSize:11, color:theme.accent1, marginBottom:36, letterSpacing:"0.15em" }}>
          — DESENVOLVIDO POR <span style={{color:theme.accent2}}>ALLTORAL</span>
        </div>
        <button className="at-btn" onClick={signIn} style={{
          display:"flex", alignItems:"center", gap:10, background:"#fff", color:"#1f1f1f",
          borderRadius:8, padding:"12px 22px", fontSize:14, fontWeight:600,
        }}>
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.9 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.7 0-14.3 4.4-17.7 10.7z"/>
            <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 35.3 27 36 24 36c-5.3 0-9.7-3.1-11.3-7.7l-6.5 5C9.6 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.8l6.6 5.4C41.5 36.3 44 30.7 44 24c0-1.3-.1-2.7-.4-3.5z"/>
          </svg>
          Entrar com Google
        </button>
        {authError && <div style={{ color:COLORS.red, fontSize:12, marginTop:14, textAlign:"center", maxWidth:280 }}>{authError}</div>}
      </div>
    );
  }

  if(!loaded){
    return (
      <div style={{ background:COLORS.bg, minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:COLORS.gray, fontSize:13 }}>
        Sincronizando...
      </div>
    );
  }

  return (
    <div style={{ background:COLORS.bg, minHeight:"100vh", paddingBottom:100 }}>
      <div className="app-header" style={{ background:`linear-gradient(180deg, ${COLORS.surface}f0 0%, ${COLORS.bg}f0 100%)`, borderBottom:`1px solid ${COLORS.border}`, padding:"calc(14px + env(safe-area-inset-top)) 20px 14px" }}>
        <div style={{ maxWidth:980, margin:"0 auto", display:"flex", alignItems:"center", justifyContent:"space-between", gap:12 }}>
          <div>
            <div className="oswald" style={{ fontSize:20, fontWeight:700 }}>DINHEIROS</div>
            <div className="oswald" style={{ fontSize:10, color:theme.accent1, marginTop:2, letterSpacing:"0.12em" }}>
              — DESENVOLVIDO POR <span style={{color:theme.accent2}}>ALLTORAL</span>
            </div>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            <div style={{ fontSize:10, color: syncError?COLORS.red:COLORS.gray, display:"flex", alignItems:"center", gap:5 }}>
              <span style={{ width:6, height:6, borderRadius:"50%", background: syncError?COLORS.red:"#4ade80", display:"inline-block" }}></span>
              <span className="hide-mobile">{syncError ? "Erro" : "Sincronizado"}</span>
            </div>
            <button className="at-btn" onClick={()=>setShowThemeModal(true)} aria-label="Tema" style={{ background:"transparent", color:COLORS.gray, padding:4, display:"flex", alignItems:"center" }}>
              <IconPalette size={17} color={COLORS.gray} />
            </button>
            {user.photoURL && <img src={user.photoURL} alt="" style={{ width:26, height:26, borderRadius:"50%" }} />}
            <button className="at-btn oswald" onClick={signOut} style={{ background:"transparent", color:COLORS.gray, fontSize:10, textDecoration:"underline", padding:"6px 2px" }}>Sair</button>
          </div>
        </div>
      </div>

      <button className="at-btn fab" onClick={()=>setShowForm(true)} aria-label="Novo lançamento">
        <IconPlus size={26} />
      </button>

      <div style={{ maxWidth:980, margin:"0 auto", padding:"24px 20px 0" }}>
        <div className="grid4" style={{ marginBottom:24 }}>
          <div style={{ background:COLORS.surface, border:`1px solid ${COLORS.border}`, borderRadius:10, padding:"18px 20px" }}>
            <div className="oswald" style={{ fontSize:11, color:theme.accent2 }}>— SALDO ATUAL</div>
            <div className="playfair" style={{ fontSize:32, fontWeight:900, marginTop:8, color: currentBalance<0?COLORS.red:COLORS.white }}>{fmtMoney(currentBalance)}</div>
            <div style={{ marginTop:10, fontSize:12, color:COLORS.gray }}>
              Em 30 dias: <span style={{ color: projected30<0?COLORS.red:theme.accent1, fontWeight:600 }}>{fmtMoney(projected30)}</span>
            </div>
          </div>
          <div style={{ background:COLORS.surface, border:`1px solid ${COLORS.border}`, borderRadius:10, padding:"16px 18px" }}>
            <div className="oswald" style={{ fontSize:10, color:COLORS.gray, display:"flex", alignItems:"center", gap:6 }}><IconUp size={13} color={theme.accent1}/> ENTRADAS</div>
            <div className="playfair" style={{ fontSize:20, fontWeight:700, marginTop:8, color:theme.accent1 }}>{fmtMoney(monthTotals.entrada)}</div>
          </div>
          <div style={{ background:COLORS.surface, border:`1px solid ${COLORS.border}`, borderRadius:10, padding:"16px 18px" }}>
            <div className="oswald" style={{ fontSize:10, color:COLORS.gray, display:"flex", alignItems:"center", gap:6 }}><IconDown size={13} color={theme.accent2}/> SAÍDAS</div>
            <div className="playfair" style={{ fontSize:20, fontWeight:700, marginTop:8, color:theme.accent2 }}>{fmtMoney(monthTotals.saida)}</div>
          </div>
          <div style={{ background:COLORS.surface, border:`1px solid ${COLORS.border}`, borderRadius:10, padding:"16px 18px" }}>
            <div className="oswald" style={{ fontSize:10, color:COLORS.gray, display:"flex", alignItems:"center", gap:6 }}><IconWallet size={13} color={COLORS.gray}/> SALDO INICIAL</div>
            <input type="number" value={initialBalance} onChange={(e)=>updateInitialBalance(parseFloat(e.target.value)||0)}
              style={{ background:"transparent", border:"none", borderBottom:`1px solid ${COLORS.border}`, color:COLORS.white, fontSize:18, fontFamily:"'Playfair Display',serif", fontWeight:700, width:"100%", marginTop:8, padding:"2px 0" }} />
          </div>
        </div>

        <div style={{ background:COLORS.surface, border:`1px solid ${COLORS.border}`, borderRadius:10, padding:"18px 10px 8px", marginBottom:24 }}>
          <div className="oswald" style={{ fontSize:11, color:COLORS.gray, padding:"0 10px 10px" }}>PROJEÇÃO DE SALDO</div>
          <BalanceChart data={withBalance} colorAccent1={theme.accent1} colorAccent2={theme.accent2} />
        </div>

        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
          <button className="at-btn" onClick={()=>changeMonth(-1)} style={{ background:COLORS.surface, border:`1px solid ${COLORS.border}`, borderRadius:6, padding:8, color:COLORS.white }}><IconLeft size={16}/></button>
          <div className="playfair" style={{ fontSize:20, fontWeight:700 }}>{monthLabel}</div>
          <button className="at-btn" onClick={()=>changeMonth(1)} style={{ background:COLORS.surface, border:`1px solid ${COLORS.border}`, borderRadius:6, padding:8, color:COLORS.white }}><IconRight size={16}/></button>
        </div>

        <div style={{ background:COLORS.surface, border:`1px solid ${COLORS.border}`, borderRadius:10, overflow:"hidden", marginBottom:20 }}>
          <div className="oswald rowgrid" style={{ fontSize:10, color:COLORS.gray, padding:"12px 14px", borderBottom:`1px solid ${COLORS.border}` }}>
            <div>DATA</div><div>DESCRIÇÃO</div><div className="hide-mobile">ENTRADA</div><div className="hide-mobile">SAÍDA</div><div>SALDO</div><div></div>
          </div>
          {monthRows.length===0 && <div style={{ padding:"30px 16px", color:COLORS.gray, fontSize:13, textAlign:"center" }}>Nenhum lançamento neste mês ainda.</div>}
          {monthRows.map(t => (
            <div key={t.key} className="row-hover rowgrid" style={{ padding:"12px 14px", borderBottom:`1px solid ${COLORS.border}`, fontSize:13 }}>
              <div style={{ color:COLORS.gray }}>{t.date.slice(8,10)}/{t.date.slice(5,7)}</div>
              <div style={{ display:"flex", alignItems:"center", gap:6, overflow:"hidden", textOverflow:"ellipsis" }}>
                {t.desc}{t.recurring && <IconRepeat size={12} color={COLORS.gray}/>}
              </div>
              <div className="hide-mobile" style={{ color:theme.accent1 }}>{t.type==="entrada"?fmtMoney(t.amount):""}</div>
              <div className="hide-mobile" style={{ color:theme.accent2 }}>{t.type==="saida"?fmtMoney(t.amount):""}</div>
              <div style={{ fontWeight:600, color: t.saldo<0?COLORS.red:COLORS.white }}>{fmtMoney(t.saldo)}</div>
              <button className="at-btn" onClick={()=>removeTransaction(t.id)} style={{ background:"transparent", color:COLORS.gray, padding:4 }}><IconTrash size={14}/></button>
            </div>
          ))}
          {monthRows.length>0 && (
            <div className="oswald rowgrid" style={{ padding:"12px 14px", fontSize:11, color:COLORS.gray, background:COLORS.surfaceAlt }}>
              <div></div><div>TOTAL DO MÊS</div>
              <div className="hide-mobile" style={{ color:theme.accent1 }}>{fmtMoney(monthTotals.entrada)}</div>
              <div className="hide-mobile" style={{ color:theme.accent2 }}>{fmtMoney(monthTotals.saida)}</div>
              <div style={{ color:COLORS.white, fontWeight:700 }}>{fmtMoney(monthTotals.saldoFinal ?? currentBalance)}</div>
              <div></div>
            </div>
          )}
        </div>

        <div style={{ textAlign:"right" }}>
          <button className="at-btn oswald" onClick={resetAll} style={{ background:"transparent", color:COLORS.gray, fontSize:11, padding:"6px 0", display:"inline-flex", alignItems:"center", gap:6 }}>
            <IconReset size={12}/> Limpar todos os dados
          </button>
        </div>
      </div>

      {showForm && (
        <div className="modal-overlay" onClick={(e)=>{ if(e.target===e.currentTarget) setShowForm(false); }}>
          <div className="modal-sheet">
            <div className="sheet-handle"></div>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18 }}>
              <div className="playfair" style={{ fontSize:20, fontWeight:700 }}>Novo lançamento</div>
              <button className="at-btn" onClick={()=>setShowForm(false)} style={{ background:"transparent", color:COLORS.gray }}><IconX size={18}/></button>
            </div>
            <div style={{ display:"flex", gap:8, marginBottom:14 }}>
              <button className="at-btn oswald" onClick={()=>setForm(f=>({...f,type:"entrada"}))} style={{ flex:1, padding:"10px 0", fontSize:12, borderRadius:6, background: form.type==="entrada"?theme.accent1:COLORS.surfaceAlt, color: form.type==="entrada"?"#0b0b0d":COLORS.gray }}>Entrada</button>
              <button className="at-btn oswald" onClick={()=>setForm(f=>({...f,type:"saida"}))} style={{ flex:1, padding:"10px 0", fontSize:12, borderRadius:6, background: form.type==="saida"?theme.accent2:COLORS.surfaceAlt, color: form.type==="saida"?"#fff":COLORS.gray }}>Saída</button>
            </div>
            <label style={{ fontSize:11, color:COLORS.gray }}>Descrição</label>
            <input value={form.desc} onChange={(e)=>setForm(f=>({...f,desc:e.target.value}))} placeholder="Ex: Salário, Aluguel..."
              style={{ width:"100%", background:COLORS.surfaceAlt, border:`1px solid ${COLORS.border}`, borderRadius:6, padding:"10px 12px", color:COLORS.white, marginTop:4, marginBottom:12 }} />
            <div style={{ display:"flex", gap:10, marginBottom:12 }}>
              <div style={{ flex:1 }}>
                <label style={{ fontSize:11, color:COLORS.gray }}>Data</label>
                <input type="date" value={form.date} onChange={(e)=>setForm(f=>({...f,date:e.target.value}))}
                  style={{ width:"100%", background:COLORS.surfaceAlt, border:`1px solid ${COLORS.border}`, borderRadius:6, padding:"10px 12px", color:COLORS.white, marginTop:4 }} />
              </div>
              <div style={{ flex:1 }}>
                <label style={{ fontSize:11, color:COLORS.gray }}>Valor (R$)</label>
                <input type="number" value={form.amount} onChange={(e)=>setForm(f=>({...f,amount:e.target.value}))} placeholder="0,00"
                  style={{ width:"100%", background:COLORS.surfaceAlt, border:`1px solid ${COLORS.border}`, borderRadius:6, padding:"10px 12px", color:COLORS.white, marginTop:4 }} />
              </div>
            </div>
            <label style={{ display:"flex", alignItems:"center", gap:8, fontSize:12, color:COLORS.gray, marginBottom: form.recurring?8:16, cursor:"pointer" }}>
              <input type="checkbox" checked={form.recurring} onChange={(e)=>setForm(f=>({...f,recurring:e.target.checked}))} />
              Repetir todo mês (lançamento fixo)
            </label>
            {form.recurring && (
              <div style={{ marginBottom:16 }}>
                <label style={{ fontSize:11, color:COLORS.gray }}>Repetir por quantos meses</label>
                <input type="number" value={form.repeatMonths} onChange={(e)=>setForm(f=>({...f,repeatMonths:e.target.value}))}
                  style={{ width:"100%", background:COLORS.surfaceAlt, border:`1px solid ${COLORS.border}`, borderRadius:6, padding:"10px 12px", color:COLORS.white, marginTop:4 }} />
              </div>
            )}
            <button className="at-btn oswald" onClick={addTransaction} style={{ width:"100%", background:theme.accent2, color:"#fff", padding:"12px 0", borderRadius:6, fontSize:13, fontWeight:600 }}>
              Adicionar
            </button>
          </div>
        </div>
      )}

      {showThemeModal && (
        <div className="modal-overlay" onClick={(e)=>{ if(e.target===e.currentTarget) setShowThemeModal(false); }}>
          <div className="modal-sheet">
            <div className="sheet-handle"></div>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18 }}>
              <div className="playfair" style={{ fontSize:20, fontWeight:700 }}>Tema</div>
              <button className="at-btn" onClick={()=>setShowThemeModal(false)} style={{ background:"transparent", color:COLORS.gray }}><IconX size={18}/></button>
            </div>

            <div className="oswald" style={{ fontSize:11, color:COLORS.gray, marginBottom:10 }}>PALETAS PRONTAS</div>
            <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:22 }}>
              {THEME_PRESETS.map(p => {
                const active = theme.accent1===p.accent1 && theme.accent2===p.accent2;
                return (
                  <button key={p.id} className="at-btn" onClick={()=>applyTheme({accent1:p.accent1, accent2:p.accent2})}
                    style={{ display:"flex", alignItems:"center", gap:12, background:COLORS.surfaceAlt, border:`1px solid ${active?COLORS.white:COLORS.border}`, borderRadius:8, padding:"10px 14px" }}>
                    <div style={{ display:"flex", gap:4 }}>
                      <span style={{ width:18, height:18, borderRadius:"50%", background:p.accent1, display:"inline-block" }}></span>
                      <span style={{ width:18, height:18, borderRadius:"50%", background:p.accent2, display:"inline-block" }}></span>
                    </div>
                    <span style={{ fontSize:13, color:COLORS.white }}>{p.name}</span>
                    {active && <span style={{ marginLeft:"auto", fontSize:12, color:p.accent1 }}>✓</span>}
                  </button>
                );
              })}
            </div>

            <div className="oswald" style={{ fontSize:11, color:COLORS.gray, marginBottom:10 }}>PERSONALIZADO</div>
            <div style={{ display:"flex", gap:16, marginBottom:6 }}>
              <div style={{ flex:1 }}>
                <label style={{ fontSize:11, color:COLORS.gray }}>Cor 1 (destaque)</label>
                <input type="color" value={theme.accent1} onChange={(e)=>applyTheme({...theme, accent1:e.target.value})}
                  style={{ width:"100%", height:42, marginTop:6, border:`1px solid ${COLORS.border}`, borderRadius:6, background:"transparent", padding:2 }} />
              </div>
              <div style={{ flex:1 }}>
                <label style={{ fontSize:11, color:COLORS.gray }}>Cor 2 (destaque)</label>
                <input type="color" value={theme.accent2} onChange={(e)=>applyTheme({...theme, accent2:e.target.value})}
                  style={{ width:"100%", height:42, marginTop:6, border:`1px solid ${COLORS.border}`, borderRadius:6, background:"transparent", padding:2 }} />
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
