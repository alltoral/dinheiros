    --bg:#0b0b0d; --surface:#161418; --surfaceAlt:#1d1a20; --border:#2b2730;
    --yellow:#F4E409; --pink:#EC1A8C; --white:#F5F5F0; --gray:#8d8894; --red:#FF5A5A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html{ height:100%; }
  body{
    margin:0; padding:0; background:var(--bg); color:var(--white); font-family:'Inter',sans-serif;
    min-height:100vh; min-height:100dvh; overscroll-behavior-y:contain; -webkit-font-smoothing:antialiased;
  }
  button, .oswald, .at-btn { -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  input, select, textarea { font-size:16px; } /* impede zoom automático no iOS ao focar */
  .oswald{ font-family:'Oswald',sans-serif; letter-spacing:.08em; text-transform:uppercase; }
  .playfair{ font-family:'Playfair Display',serif; }

  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

  .at-btn:hover{ filter:brightness(1.08); }
  .at-btn:active{ transform:scale(0.96); }
  .row-hover:active{ background:var(--surfaceAlt); }
  .grid4{ display:grid; grid-template-columns:1.3fr 1fr 1fr 1fr; gap:14px; }
  .rowgrid{ display:grid; grid-template-columns:70px 1fr 100px 100px 110px 56px; align-items:center; }
  .app-header{ position:sticky; top:0; z-index:30; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .fab{
    position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom));
    width:58px; height:58px; border-radius:50%; background:var(--pink); color:#fff;
    display:flex; align-items:center; justify-content:center; z-index:40;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
  }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    background:var(--surface); border:1px solid var(--border); border-bottom:none;
    width:100%; max-width:460px; padding:14px 24px calc(24px + env(safe-area-inset-bottom));
    border-radius:20px 20px 0 0; max-height:88vh; overflow-y:auto;
    animation:slideUp .28s cubic-bezier(.32,.72,0,1);
  }
  .sheet-handle{ width:36px; height:4px; border-radius:2px; background:var(--border); margin:0 auto 16px; }
  @keyframes slideUp{ from{ transform:translateY(40px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  @media (min-width:600px){
    .modal-overlay{ align-items:center; padding:20px; }
    .modal-sheet{ border-radius:16px; border-bottom:1px solid var(--border); padding:24px; max-height:none; animation:none; }
    .sheet-handle{ display:none; }
  }
  @media (max-width:720px){
    .grid4{ grid-template-columns:1fr 1fr; }
    .rowgrid{ grid-template-columns:56px 1fr 90px 56px; }
    .hide-mobile{ display:none !important; }
  }

  /* ---------- Larot (assistente de voz) ---------- */
  #larotMicBtn{
    position:fixed; right:20px; bottom:calc(92px + env(safe-area-inset-bottom)); z-index:45;
    width:58px; height:58px; border:none; background:transparent; padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,0.45));
    transition:transform .15s ease;
  }
  #larotMicBtn:hover{ transform:scale(1.06); }
  #larotMicBtn img{ width:100%; height:100%; object-fit:contain; pointer-events:none; user-select:none; }
  #larotMicImgActive{ display:none; }
  #larotMicImgMuted{ display:block; filter:none; }
  #larotMicBtn.listening #larotMicImgActive{ display:block; }
  #larotMicBtn.listening #larotMicImgMuted{ display:none; }
  #larotMicBtn.paused #larotMicImgActive{ display:none; }
  #larotMicBtn.paused #larotMicImgMuted{ display:block; filter:grayscale(100%); }
  #larotMicBtn.listening{ animation:larotPulse 1.1s ease-in-out infinite; }
  @keyframes larotPulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.08); }
  }
  #larotToast{
    position:fixed; right:20px; bottom:calc(156px + env(safe-area-inset-bottom)); z-index:45; max-width:280px;
    background:var(--surface); color:var(--white); border:1px solid var(--border); border-radius:14px;
    padding:12px 16px; font-family:'Inter',sans-serif; font-size:13.5px; line-height:1.4;
    box-shadow:0 6px 20px rgba(0,0,0,0.5); display:none;
  }
  #larotToast.show{ display:block; }
  #larotDebugToggle{
    position:fixed; left:16px; bottom:16px; z-index:45;
    width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--white); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; opacity:0.55;
  }
  #larotDebugPanel{
    display:none; position:fixed; left:16px; bottom:58px; z-index:45;
    width:min(360px, calc(100vw - 32px)); max-height:40vh; overflow-y:auto;
    background:rgba(0,0,0,0.92); color:#8f8; border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-family:monospace; font-size:11px; line-height:1.5; white-space:pre-wrap;
  }
  #larotDebugPanel.show{ display:block; }
  @media (max-width:640px){

    #larotToast{ right:14px; bottom:calc(144px + env(safe-area-inset-bottom)); max-width:calc(100vw - 28px); }

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const COLORS = {
  bg:"#0b0b0d", surface:"#161418", surfaceAlt:"#1d1a20", border:"#2b2730",
  yellow:"#F4E409", pink:"#EC1A8C", white:"#F5F5F0", gray:"#8d8894", red:"#FF5A5A",
};
const DEFAULT_THEME = { accent1: COLORS.yellow, accent2: COLORS.pink, accent3: "#C7CBD1" };
const THEME_PRESETS = [
  { id: "alltoral", name: "ALLTORAL Original", accent1: "#F4E409", accent2: "#EC1A8C", accent3: "#C7CBD1" },
  { id: "verde-roxo", name: "Verde & Roxo", accent1: "#4ADE80", accent2: "#A855F7", accent3: "#FBBF24" },
  { id: "azul-laranja", name: "Azul & Laranja", accent1: "#38BDF8", accent2: "#FB923C", accent3: "#E2E8F0" },

];
const MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtMoney = (v) => (v<0?"-R$ ":"R$ ") + Math.abs(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid = () => Math.random().toString(36).slice(2,10);

// --- simple inline icons (no external icon lib needed) ---

const IconPlus = (p) => <Icon {...p} path="M12 5v14M5 12h14" />;

const IconUp = (p) => <Icon {...p} path="M23 6l-9.5 9.5-5-5L1 18" />;

function expandTransactions(transactions){
  const all = [];
  transactions.forEach((t) => {
    if(t.parcelado){
      const total = (t.installments||[]).length;
      (t.installments||[]).forEach((inst) => {
        all.push({ ...t, key:`${t.id}-${inst.seq}`, date:inst.date, amount:inst.amount, installmentSeq:inst.seq, installmentTotal: total });
      });
      return;
    }
    if(!t.recurring){ all.push({...t, key:t.id, date:t.date}); return; }
    const [y,m,d] = t.date.split("-").map(Number);
    const months = t.repeatMonths || 12;
    for(let i=0;i<months;i++){
      const dt = new Date(y, m-1+i, d);
      all.push({...t, key:`${t.id}-${i}`, date:`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`});
    }
  });
  return all.sort((a,b)=> a.date.localeCompare(b.date) || a.key.localeCompare(b.key));
}

// --- lightweight dependency-free line chart ---
function BalanceChart({ data, colorAccent1, colorAccent2 }){
  const width = 900, height = 220, padL = 50, padR = 20, padT = 15, padB = 25;
  if(!data.length) return <div style={{padding:30,color:COLORS.gray,fontSize:13,textAlign:"center"}}>Sem dados para mostrar ainda.</div>;

  const values = data.map(d => d.saldo);
  const min = Math.min(0, ...values), max = Math.max(0, ...values);
  const range = (max - min) || 1;
  const innerW = width - padL - padR, innerH = height - padT - padB;

  const x = (i) => padL + (i/(data.length-1 || 1)) * innerW;
  const y = (v) => padT + innerH - ((v - min)/range) * innerH;

  const todayIdx = data.findIndex(d => d.date >= todayISO());
  const splitIdx = todayIdx === -1 ? data.length - 1 : todayIdx;

  const pathFor = (from, to) => {
    if(to - from < 1) return "";
    let d = `M ${x(from)} ${y(data[from].saldo)}`;
    for(let i=from+1;i<=to;i++) d += ` L ${x(i)} ${y(data[i].saldo)}`;
    return d;
  };
  const realPath = pathFor(0, splitIdx);
  const projPath = pathFor(splitIdx, data.length - 1);
  const zeroY = y(0);

  const [hover, setHover] = useState(null);

  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{width:"100%", height:220, display:"block"}}
      onMouseMove={(e)=>{
        const rect = e.currentTarget.getBoundingClientRect();
        const px = (e.clientX-rect.left)/rect.width*width;
        const idx = Math.round(((px-padL)/innerW)*(data.length-1));
        if(idx>=0 && idx<data.length) setHover(idx);
      }}
      onMouseLeave={()=>setHover(null)}
    >
      {[0,0.25,0.5,0.75,1].map((f,i)=>(
        <line key={i} x1={padL} x2={width-padR} y1={padT+f*innerH} y2={padT+f*innerH} stroke={COLORS.border} strokeDasharray="3 3" />
      ))}
      <line x1={padL} x2={width-padR} y1={zeroY} y2={zeroY} stroke={COLORS.red} strokeDasharray="4 4" />
      <path d={realPath} stroke={colorAccent1} strokeWidth="2.5" fill="none" />
      <path d={projPath} stroke={colorAccent2} strokeWidth="2.5" strokeDasharray="6 4" fill="none" />
      {[min, (min+max)/2, max].map((v,i)=>(
        <text key={i} x={4} y={y(v)+4} fontSize="10" fill={COLORS.gray}>{(v/1000).toFixed(1)}k</text>
      ))}
      {hover!=null && (
        <>
          <line x1={x(hover)} x2={x(hover)} y1={padT} y2={height-padB} stroke={COLORS.gray} strokeDasharray="2 2" />
          <circle cx={x(hover)} cy={y(data[hover].saldo)} r="4" fill={hover<=splitIdx?colorAccent1:colorAccent2} />
          <text x={Math.min(x(hover)+8, width-150)} y={padT+14} fontSize="11" fill={COLORS.white}>
            {data[hover].date.split("-").reverse().join("/")} · {fmtMoney(data[hover].saldo)}
          </text>
        </>
      )}
    </svg>
  );
}

/* ---------- Larot: assistente de voz ----------
   Comandos:
   - "entrada de 2,37 pix da Ana" / "saída de 1,50 aluguel" → lançamento único, hoje.
   - "parcelamento de 100 por 3 meses celular novo" → parcelado (mesma lógica
     de "adicionar" com mode=parcelado: uma parcela por mês, valor igual em todas).
   - "quanto vou ter dia 20" / "quanto vou ter essa semana"... (com ou sem data
     — sem data, é "quanto tenho hoje") → lê o saldo projetado pra aquela data,
     reaproveitando a mesma expandTransactions()+soma corrida que o app usa. */
function larotNormalize(text){
  return text.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}
function larotParseAmount(raw){
  let s = raw.trim().replace(/r\$\s*/i, "");
  if(s.indexOf(".") !== -1 && s.indexOf(",") !== -1){
    s = s.replace(/\./g, "").replace(",", ".");
  } else {
    s = s.replace(",", ".");
  }
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
const LAROT_MONEY_RE = /(\d+(?:[.,]\d+)*)/;
function larotStripSpans(text, spans){
  const sorted = spans.slice().sort((a,b)=> b.start-a.start);
  let result = text;
  sorted.forEach((sp)=>{ result = result.slice(0,sp.start) + " " + result.slice(sp.end); });
  return result.replace(/\s{2,}/g, " ").trim();
}
const LAROT_DESC_STOPWORDS = new Set([
  "adicionar","adiciona","criar","cria","lancar","lanca","registrar","registra",
  "colocar","coloca","anotar","anota","bota","por","poe","entrada","saida",
  "parcelamento","parcelado","parcelada","de","do","da","um","uma","no","na",
  "valor","reais","real","vezes","meses","mes"
]);
function larotCleanDesc(text){
  const trimmed = text.replace(/^[\s,;:.!?\-–—]+|[\s,;:.!?\-–—]+$/g, "");
  const words = trimmed.split(/\s+/).filter(Boolean);
  let i = 0;
  while(i < words.length && (LAROT_DESC_STOPWORDS.has(larotNormalize(words[i])) || /^[,.\-:;]+$/.test(words[i]))) i++;
  const cleaned = words.slice(i).join(" ").trim();
  if(!cleaned) return "";
  return cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
}

function larotParseEntrySaida(clean, lower){
  const em = lower.match(/\bentrada\b/);
  const sm = lower.match(/\bsaida\b/);
  if(!em && !sm) return null;
  const type = (em && (!sm || em.index < sm.index)) ? "entrada" : "saida";
  const triggerMatch = type === "entrada" ? em : sm;
  const mm = clean.match(LAROT_MONEY_RE);
  if(!mm) return null;
  const amount = larotParseAmount(mm[0]);
  if(amount === null || amount <= 0) return null;
  const rest = larotStripSpans(clean, [
    { start: triggerMatch.index, end: triggerMatch.index + triggerMatch[0].length },
    { start: mm.index, end: mm.index + mm[0].length },
  ]);
  const desc = larotCleanDesc(rest);
  return { type, amount, desc: desc || (type === "entrada" ? "Entrada" : "Saída") };
}

const LAROT_PARCEL_RE = /\bparcelamento\b|\bparcelad[oa]\b/;
const LAROT_PARCEL_MONTHS_RE = /\bpor\s+(\d+)\s*mes(?:es)?\b|\bem\s+(\d+)\s*(?:x|vezes)\b|\b(\d+)\s*x\b|\b(\d+)\s*mes(?:es)?\b/;
function larotParseParcelamento(clean, lower){
  if(!LAROT_PARCEL_RE.test(lower)) return null;
  const mm = clean.match(LAROT_MONEY_RE);
  if(!mm) return { error:true, reason:"valor" };
  const amount = larotParseAmount(mm[0]);
  if(amount === null || amount <= 0) return { error:true, reason:"valor" };
  const monthsMatch = lower.match(LAROT_PARCEL_MONTHS_RE);
  const count = monthsMatch ? parseInt(monthsMatch[1]||monthsMatch[2]||monthsMatch[3]||monthsMatch[4], 10) : null;
  if(!count || count < 2) return { error:true, reason:"meses" };
  const pm = lower.match(LAROT_PARCEL_RE);
  const spans = [{ start: mm.index, end: mm.index + mm[0].length }];
  if(pm) spans.push({ start: pm.index, end: pm.index + pm[0].length });
  if(monthsMatch) spans.push({ start: monthsMatch.index, end: monthsMatch.index + monthsMatch[0].length });
  const rest = larotStripSpans(clean, spans);
  const desc = larotCleanDesc(rest) || "Parcelamento";
  return { amount, count, desc };
}

function larotAddDaysDate(date, n){ const d = new Date(date.getTime()); d.setDate(d.getDate()+n); return d; }
function larotToISODate(date){ const d = new Date(date.getTime()); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function larotExtractDate(text){
  const lower = larotNormalize(text);
  const today = new Date(); today.setHours(0,0,0,0);
  let m;

  if(lower.match(/depois de amanha/)) return larotToISODate(larotAddDaysDate(today,2));
  if(lower.match(/\bamanha\b/)) return larotToISODate(larotAddDaysDate(today,1));
  if(lower.match(/\bhoje\b/)) return larotToISODate(today);

  m = lower.match(/\b(?:em|daqui a)\s+(\d{1,2})\s+dias?\b/);
  if(m) return larotToISODate(larotAddDaysDate(today, parseInt(m[1],10)));

  m = text.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  if(m){
    const dd = parseInt(m[1],10), mo = parseInt(m[2],10)-1;
    const yyyy = m[3] ? (m[3].length===2 ? 2000+parseInt(m[3],10) : parseInt(m[3],10)) : today.getFullYear();
    return larotToISODate(new Date(yyyy,mo,dd));
  }

  const MONTHS_PT = ["janeiro","fevereiro","marco","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  m = lower.match(new RegExp("\\b(?:dia\\s+)?(\\d{1,2})\\s+de\\s+(" + MONTHS_PT.join("|") + ")\\b"));
  if(m){
    const dayM = parseInt(m[1],10), monthIdx = MONTHS_PT.indexOf(m[2]);
    let c = new Date(today.getFullYear(), monthIdx, dayM);
    if(c<today) c = new Date(today.getFullYear()+1, monthIdx, dayM);
    return larotToISODate(c);
  }

  m = lower.match(/\bdia\s+(\d{1,2})\b/);
  if(m){
    const day = parseInt(m[1],10);
    let c = new Date(today.getFullYear(), today.getMonth(), day);
    if(c<today) c = new Date(today.getFullYear(), today.getMonth()+1, day);
    return larotToISODate(c);
  }

  const WEEKDAYS = [["domingo",0],["segunda",1],["terca",2],["quarta",3],["quinta",4],["sexta",5],["sabado",6]];
  for(let i=0;i<WEEKDAYS.length;i++){
    m = lower.match(new RegExp("(proxima\\s+)?\\b" + WEEKDAYS[i][0] + "(-feira)?\\b"));
    if(m){
      let diff = (WEEKDAYS[i][1]-today.getDay()+7)%7;
      if(diff===0) diff = 7;
      return larotToISODate(larotAddDaysDate(today, diff));
    }
  }
  return null;
}

function larotBalanceAt(transactions, initialBalance, targetISO){
  const expanded = expandTransactions(transactions);
  let running = initialBalance;
  for(let i=0;i<expanded.length;i++){
    if(expanded[i].date > targetISO) break;
    running += expanded[i].type === "entrada" ? expanded[i].amount : -expanded[i].amount;
  }
  return running;
}
function larotHandleBalanceQuery(clean, transactions, initialBalance){
  const today = todayISO();
  const targetISO = larotExtractDate(clean) || today;
  const balance = larotBalanceAt(transactions, initialBalance, targetISO);
  const label = targetISO === today ? "hoje" : targetISO.split("-").reverse().join("/");
  return { ok:true, message: "Em " + label + " você deve ter " + fmtMoney(balance) + ".", speak:true };
}

const LAROT_BALANCE_QUERY_RE = /\bquanto\b/;
function larotDispatch(transcript, ctx){
  if(!transcript || !transcript.trim()) return { ok:false, message:"Não ouvi nada." };
  const clean = transcript.replace(/^[\s,;:.!?\-–—]+/, "").replace(/[\s,;:.!?\-–—]+$/, "");
  if(!clean) return { ok:false, message:"Não ouvi nada." };
  const lower = larotNormalize(clean);

  if(LAROT_BALANCE_QUERY_RE.test(lower)){
    return larotHandleBalanceQuery(clean, ctx.transactions, ctx.initialBalance);
  }

  if(LAROT_PARCEL_RE.test(lower)){
    const parsed = larotParseParcelamento(clean, lower);
    if(!parsed) return { ok:false, message:"Não entendi o parcelamento." };
    if(parsed.error === true && parsed.reason === "meses") return { ok:false, message:'Fala também por quantos meses, tipo "por 3 meses".' };
    if(parsed.error) return { ok:false, message:"Não entendi o valor do parcelamento." };
    const type = /\bentrada\b/.test(lower) ? "entrada" : "saida";
    ctx.addParcelamento(type, parsed.amount, parsed.count, parsed.desc);
    return { ok:true, message: "Parcelamento de " + fmtMoney(parsed.amount) + " em " + parsed.count + "x — " + parsed.desc };
  }

  const entry = larotParseEntrySaida(clean, lower);
  if(entry){
    ctx.addSimple(entry.type, entry.amount, entry.desc);
    return { ok:true, message: (entry.type === "entrada" ? "+ " : "− ") + fmtMoney(entry.amount) + " — " + entry.desc };
  }

  return { ok:false, message:'Não entendi. Fala "entrada de [valor] [descrição]", "saída de...", "parcelamento de [valor] por [N] meses", ou "quanto vou ter em [data]".' };
}

function App(){
  const [user, setUser] = useState(undefined); // undefined = ainda checando, null = deslogado
  const [authError, setAuthError] = useState(null);
  const [transactions, setTransactions] = useState([]);
  const [initialBalance, setInitialBalance] = useState(0);
  const [theme, setTheme] = useState(DEFAULT_THEME);
  const [showThemeModal, setShowThemeModal] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [syncError, setSyncError] = useState(false);
  const [cursor, setCursor] = useState(() => {
    const n = new Date();
    return { year: n.getFullYear(), month: n.getMonth() };
  });
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ date: todayISO(), desc:"", type:"entrada", amount:"", mode:"unico", repeatMonths:12, installmentCount:2 });
  const [editingParcelId, setEditingParcelId] = useState(null);
  const [draftInstallments, setDraftInstallments] = useState([]);
  const [editingTxId, setEditingTxId] = useState(null);
  const [editForm, setEditForm] = useState(null);

  useEffect(() => {
    const unsub = window.__auth.onAuthStateChanged((u) => setUser(u || null));
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!user) { setLoaded(false); return; }
    const ref = window.__db.collection("alltoral-fin").doc(user.uid);
    const unsub = ref.onSnapshot(
      (snap) => {
        const d = snap.exists ? snap.data() : {};
        setTransactions(d.transactions || []);
        setInitialBalance(d.initialBalance || 0);
        setTheme(d.theme || DEFAULT_THEME);
        setLoaded(true);
        setSyncError(false);
      },
      (err) => { console.error(err); setSyncError(true); setLoaded(true); }
    );
    return () => unsub();
  }, [user]);

  useEffect(() => {
    document.documentElement.style.setProperty("--yellow", theme.accent1);
    document.documentElement.style.setProperty("--pink", theme.accent2);
  }, [theme]);

  useEffect(() => {
    if(!editingParcelId){ setDraftInstallments([]); return; }
    const tx = transactions.find(t => t.id === editingParcelId);
    setDraftInstallments(tx && tx.installments ? tx.installments.map(i=>({...i})) : []);
  }, [editingParcelId]);

  function persist(newTx, newBal){
    if (!user) return;
    window.__db.collection("alltoral-fin").doc(user.uid)
      .set({ transactions: newTx, initialBalance: newBal }, { merge: true })
      .catch((e) => { console.error(e); setSyncError(true); });
  }

  function persistTheme(newTheme){
    if (!user) return;
    window.__db.collection("alltoral-fin").doc(user.uid)
      .set({ theme: newTheme }, { merge: true })
      .catch((e) => { console.error(e); setSyncError(true); });
  }

  function applyTheme(newTheme){
    setTheme(newTheme);
    persistTheme(newTheme);
  }

  function signIn(){
    setAuthError(null);
    window.__auth.signInWithPopup(window.__googleProvider).catch((e) => {
      console.error(e);
      setAuthError("Não deu pra entrar. Tente de novo (verifique se pop-ups estão liberados).");
    });
  }
  function signOut(){ window.__auth.signOut(); }

  const expanded = useMemo(() => expandTransactions(transactions), [transactions]);
  const withBalance = useMemo(() => {
    let running = initialBalance;
    return expanded.map((t) => {
      running += t.type === "entrada" ? t.amount : -t.amount;
      return { ...t, saldo: running };
    });
  }, [expanded, initialBalance]);

  const today = todayISO();
  const currentBalance = useMemo(() => {
    const past = withBalance.filter(t => t.date <= today);
    return past.length ? past[past.length-1].saldo : initialBalance;
  }, [withBalance, today, initialBalance]);

  const projected30 = useMemo(() => {
    const limit = new Date(); limit.setDate(limit.getDate()+30);
    const limitISO = limit.toISOString().slice(0,10);
    const upto = withBalance.filter(t => t.date <= limitISO);
    return upto.length ? upto[upto.length-1].saldo : currentBalance;
  }, [withBalance, currentBalance]);

  const monthLabel = `${MONTHS[cursor.month]} ${cursor.year}`;

  const monthTotals = useMemo(() => {
    let entrada=0, saida=0;
    monthRows.forEach(t => t.type==="entrada" ? entrada+=t.amount : saida+=t.amount);
    return { entrada, saida, saldoFinal: monthRows.length ? monthRows[monthRows.length-1].saldo : null };
  }, [monthRows]);

  function addTransaction(){
    const amount = parseFloat(String(form.amount).replace(",", "."));
    if(!form.desc.trim() || !amount || amount<=0 || !form.date) return;

    let newTx;
    if(form.mode === "parcelado"){
      const count = Math.max(2, Number(form.installmentCount)||2);
      const [y,m,d] = form.date.split("-").map(Number);
      const installments = Array.from({length:count}, (_,i) => {
        const dt = new Date(y, m-1+i, d);
        return {
          seq: i+1,
          date: `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`,
          amount,
        };
      });
      newTx = [...transactions, { id: uid(), desc: form.desc.trim(), type: form.type, parcelado:true, installments }];
    } else {
      newTx = [...transactions, {
        id: uid(), date: form.date, desc: form.desc.trim(), type: form.type, amount,
        recurring: form.mode==="fixo", repeatMonths: form.mode==="fixo" ? (Number(form.repeatMonths)||12) : 1,
      }];
    }
    setTransactions(newTx);
    persist(newTx, initialBalance);
    setForm({ date: todayISO(), desc:"", type:"entrada", amount:"", mode:"unico", repeatMonths:12, installmentCount:2 });
    setShowForm(false);
  }
  function removeTransaction(id){
    const newTx = transactions.filter(t => t.id !== id);
    setTransactions(newTx);
    persist(newTx, initialBalance);
  }
  function updateInitialBalance(val){
    setInitialBalance(val);
    persist(transactions, val);
  }
  function changeMonth(delta){
    setCursor(c => {
      let m=c.month+delta, y=c.year;
      if(m<0){ m=11; y-=1; } if(m>11){ m=0; y+=1; }
      return { year:y, month:m };
    });

    const amount = parseFloat(String(editForm.amount).replace(",", "."));
    if(!editForm.desc.trim() || !amount || amount<=0 || !editForm.date) return;
    const newTx = transactions.map(x => x.id === editingTxId ? {
      ...x,
      desc: editForm.desc.trim(),
      type: editForm.type,
      date: editForm.date,
      amount,
      recurring: editForm.recurring,
      repeatMonths: editForm.recurring ? (Number(editForm.repeatMonths)||12) : 1,
    } : x);
    setTransactions(newTx);
    persist(newTx, initialBalance);
    closeEditModal();
  }

  function larotAddSimple(type, amount, desc){
    const newTx = [...transactions, {
      id: uid(), date: todayISO(), desc, type, amount, recurring:false, repeatMonths:1,
    }];
    setTransactions(newTx);
    persist(newTx, initialBalance);
  }
  function larotAddParcelamento(type, amount, count, desc){
    const [y,m,d] = todayISO().split("-").map(Number);
    const installments = Array.from({length:count}, (_,i) => {
      const dt = new Date(y, m-1+i, d);
      return { seq:i+1, date:`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`, amount };
    });
    const newTx = [...transactions, { id: uid(), desc, type, parcelado:true, installments }];
    setTransactions(newTx);
    persist(newTx, initialBalance);
  }

  // Reexpõe o bridge a cada mudança de estado, pra o Larot sempre enxergar
  // os lançamentos e o saldo mais recentes (sem isso, um "quanto vou ter"
  // logo depois de um "entrada de..." leria dados desatualizados).
  useEffect(() => {
    window.LarotBridge = {
      appId: "dinheiros",
      isReady: () => !!user && loaded,
      handleVoiceCommand: (transcript) => larotDispatch(transcript, {
        transactions, initialBalance,
        addSimple: larotAddSimple,
        addParcelamento: larotAddParcelamento,
      }),
    };
    const micBtn = document.getElementById("larotMicBtn");
    const debugBtn = document.getElementById("larotDebugToggle");
    const visible = !!user && loaded;
    if(micBtn) micBtn.style.display = visible ? "flex" : "none";
    if(debugBtn) debugBtn.style.display = visible ? "flex" : "none";
  }, [transactions, initialBalance, user, loaded]);

  if (user === undefined) {
    return (
      <div style={{ background:COLORS.bg, minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:COLORS.gray, fontSize:13 }}>
        Carregando...
      </div>
    );
  }

  if (user === null) {
    return (
      <div style={{ background:COLORS.bg, minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:20 }}>
        <div className="oswald" style={{ fontSize:26, fontWeight:700, marginBottom:6 }}>
          DINHEIROS
        </div>
        <div className="oswald" style={{ fontSize:11, color:theme.accent1, marginBottom:36, letterSpacing:"0.15em" }}>
          — DESENVOLVIDO POR <span style={{color:theme.accent2}}>ALLTORAL</span>
        </div>
        <button className="at-btn" onClick={signIn} style={{
          display:"flex", alignItems:"center", gap:10, background:"#fff", color:"#1f1f1f",
          borderRadius:8, padding:"12px 22px", fontSize:14, fontWeight:600,
        }}>
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.9 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.7 0-14.3 4.4-17.7 10.7z"/>
            <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 35.3 27 36 24 36c-5.3 0-9.7-3.1-11.3-7.7l-6.5 5C9.6 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.8l6.6 5.4C41.5 36.3 44 30.7 44 24c0-1.3-.1-2.7-.4-3.5z"/>
          </svg>

        </button>
        {authError && <div style={{ color:COLORS.red, fontSize:12, marginTop:14, textAlign:"center", maxWidth:280 }}>{authError}</div>}
      </div>
    );
  }

  if(!loaded){
    return (
      <div style={{ background:COLORS.bg, minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:COLORS.gray, fontSize:13 }}>
        Sincronizando...
      </div>
    );
  }

  return (
    <div style={{ background:COLORS.bg, minHeight:"100vh", paddingBottom:100 }}>
      <div className="app-header" style={{ background:`linear-gradient(180deg, ${COLORS.surface}f0 0%, ${COLORS.bg}f0 100%)`, borderBottom:`1px solid ${COLORS.border}`, padding:"calc(14px + env(safe-area-inset-top)) 20px 14px" }}>
        <div style={{ maxWidth:980, margin:"0 auto", display:"flex", alignItems:"center", justifyContent:"space-between", gap:12 }}>

                    style={{ display:"flex", alignItems:"center", gap:12, background:COLORS.surfaceAlt, border:`1px solid ${active?COLORS.white:COLORS.border}`, borderRadius:8, padding:"10px 14px" }}>
                    <div style={{ display:"flex", gap:4 }}>

                      <span style={{ width:16, height:16, borderRadius:"50%", background:p.accent2, display:"inline-block" }}></span>

            <div className="oswald" style={{ fontSize:11, color:COLORS.gray, marginBottom:10 }}>PERSONALIZADO</div>
            <div style={{ display:"flex", gap:12, marginBottom:6 }}>

                  style={{ width:"100%", height:42, marginTop:6, border:`1px solid ${COLORS.border}`, borderRadius:6, background:"transparent", padding:2 }} />
              </div>

          </div>

      )}

      {editingParcelId && (() => {
        const tx = transactions.find(t => t.id === editingParcelId);
        if(!tx) return null;
        const total = draftInstallments.reduce((s,i)=> s + (parseFloat(i.amount)||0), 0);
        return (
          <div className="modal-overlay" onClick={(e)=>{ if(e.target===e.currentTarget) setEditingParcelId(null); }}>
            <div className="modal-sheet">

              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
                <div className="playfair" style={{ fontSize:20, fontWeight:700 }}>Editar parcelamento</div>
                <button className="at-btn" onClick={()=>setEditingParcelId(null)} style={{ background:"transparent", color:COLORS.gray }}><IconX size={18}/></button>
              </div>
              <div style={{ fontSize:12, color:COLORS.gray, marginBottom:16, display:"flex", alignItems:"center", gap:6 }}>

              <div style={{ display:"flex", flexDirection:"column", gap:10, marginBottom:16, maxHeight:"48vh", overflowY:"auto" }}>

                    <div style={{ fontSize:11, color:COLORS.gray, width:56, flexShrink:0 }}>{inst.date.slice(8,10)}/{inst.date.slice(5,7)}/{inst.date.slice(0,4)}</div>
                    <input type="number" value={inst.amount}

                        setDraftInstallments(arr => arr.map((x,i)=> i===idx ? {...x, amount:v} : x));

                      style={{ flex:1, background:COLORS.surfaceAlt, border:`1px solid ${COLORS.border}`, borderRadius:6, padding:"8px 10px", color:COLORS.white }} />
                  </div>
                ))}

              <button className="at-btn oswald" onClick={saveParcelamento} style={{ width:"100%", background:theme.accent3, color:"#0b0b0d", padding:"12px 0", borderRadius:6, fontSize:13, fontWeight:600 }}>

<script>
(function(){
  "use strict";

  var micBtn = document.getElementById("larotMicBtn");
  var toastEl = document.getElementById("larotToast");
  if(!micBtn || !toastEl) return;

  var SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognitionImpl) return; // navegador sem suporte a voz: botão fica escondido

  var recognition = new SpeechRecognitionImpl();
  recognition.lang = "pt-BR";
  recognition.maxAlternatives = 1;
  recognition.continuous = true;     // não finaliza sozinho na primeira pausa curta
  recognition.interimResults = true; // pra mostrar o que está entendendo em tempo real

  var SILENCE_MS = 1600; // quanto tempo de silêncio de verdade até considerar que você terminou

  var toastTimer = null;
  var silenceTimer = null;
  var listening = false;  // true = capturando sua fala agora
  var finalChunks = "";   // texto final acumulado durante a captação atual

  /* Painel de depuração visível na tela — pra ver o que está acontecendo
     direto no celular (print da tela), sem precisar de ferramenta nenhuma
     conectada no computador. */
  var debugToggleBtn = document.getElementById("larotDebugToggle");
  var debugPanelEl = document.getElementById("larotDebugPanel");
  var debugLines = [];
  function larotLog(msg){
    console.log("[Larot]", msg);
    debugLines.push(new Date().toLocaleTimeString() + " — " + msg);
    if(debugLines.length > 40) debugLines.shift();
    if(debugPanelEl){
      debugPanelEl.textContent = debugLines.join("\n");
      debugPanelEl.scrollTop = debugPanelEl.scrollHeight;
    }
  }
  if(debugToggleBtn && debugPanelEl){
    debugToggleBtn.addEventListener("click", function(){
      debugPanelEl.classList.toggle("show");
    });
  }

  var toastMsgEl = document.getElementById("larotToastMsg");

  function showToast(text, ms){
    toastMsgEl.textContent = text;
    toastEl.classList.add("show");
    if(toastTimer) clearTimeout(toastTimer);
    if(ms !== 0){
      toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, ms || 5000);
    }
  }

  /* Só fala em voz alta as respostas marcadas com "speak" (a consulta de
     saldo projetado) — o resto fica só no texto, pra emendar comandos rápido. */
  var preferredVoice = null;
  var MALE_VOICE_HINT_RE = /male|masculin|homem|\b(daniel|ricardo|thiago|felipe|rafael|gustavo|f[aá]bio|rodrigo|bruno|marcos|paulo|jos[eé]|jo[aã]o|carlos|ant[oô]nio|pedro|fernando|eduardo|hugo|diego|leonardo|luiz|luís|miguel|davi|gabriel|lucas|matheus|andr[eé])\b/i;
  function pickVoice(){
    if(!("speechSynthesis" in window)) return;
    var voices = window.speechSynthesis.getVoices();
    var ptVoices = voices.filter(function(v){ return /^pt/i.test(v.lang); });
    var male = ptVoices.find(function(v){ return MALE_VOICE_HINT_RE.test(v.name); });
    preferredVoice = male || ptVoices[0] || null;
  }
  if("speechSynthesis" in window){
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }
  function speak(text){
    if(!("speechSynthesis" in window)) return;
    try{
      var utter = new SpeechSynthesisUtterance(text);
      utter.lang = "pt-BR";
      if(preferredVoice) utter.voice = preferredVoice;
      utter.pitch = 0.6;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }catch(e){}
  }

  function setListening(v){
    listening = v;
    micBtn.classList.toggle("listening", v);
  }

  function handleTranscript(transcript){
    larotLog("processando: " + JSON.stringify(transcript));
    var bridge = window.LarotBridge;
    if(!bridge || typeof bridge.handleVoiceCommand !== "function"){
      larotLog("LarotBridge indisponível");
      showToast("Larot não está disponível neste app ainda.");
      return;
    }
    Promise.resolve(bridge.handleVoiceCommand(transcript)).then(function(result){
      larotLog("resultado: " + JSON.stringify(result));
      var msg = (result && result.message) || (result && result.ok ? "Feito." : "Não consegui fazer isso.");
      showToast(msg);
      if(result && result.speak) speak(msg);
    });
  }

  /* Enquanto você fala, continuamos ouvindo até SILENCE_MS de silêncio de
     verdade (em vez de cortar na primeira pausa curta). Pra montar o texto,
     usamos sempre o ÚLTIMO resultado recebido como "tudo que você falou
     até agora" — em vez de somar vários trechos, o que em alguns celulares
     causava texto duplicado/repetido. */
  function handleResultEvent(e){
    var lastIdx = e.results.length - 1;
    if(lastIdx >= 0) finalChunks = e.results[lastIdx][0].transcript;
    larotLog("resultado #" + e.results.length + (e.results[lastIdx] && e.results[lastIdx].isFinal ? " (final)" : " (interino)") + ": " + JSON.stringify(finalChunks));
    if(finalChunks) showToast("Ouvindo: “" + finalChunks + "”", 0);

    if(silenceTimer) clearTimeout(silenceTimer);
    silenceTimer = setTimeout(function(){
      larotLog("silêncio detectado, finalizando");
      finishListening();
    }, SILENCE_MS);
  }
  recognition.addEventListener("result", handleResultEvent);

  function processAndReset(){
    if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer = null; }
    var transcript = finalChunks.trim();
    finalChunks = "";
    setListening(false);
    if(transcript) handleTranscript(transcript);
    else larotLog("nada pra processar (texto vazio)");
  }

  function finishListening(){
    if(!listening){ larotLog("finishListening chamado mas já não estava ouvindo"); return; }
    processAndReset();
    try{ recognition.stop(); }catch(e){ larotLog("erro ao chamar stop(): " + e); }
  }

  recognition.addEventListener("end", function(){
    larotLog("evento nativo 'end' disparou (listening=" + listening + ")");
    if(listening) processAndReset();
  });

  recognition.addEventListener("error", function(e){
    larotLog("evento 'error': " + e.error);
    if(e.error === "not-allowed" || e.error === "service-not-allowed"){
      micBtn.classList.add("paused");
      showToast("Preciso de permissão pro microfone. Toque no personagem pra tentar de novo.");
      finalChunks = "";
      setListening(false);
      if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer = null; }
      return;
    }
    if(finalChunks.trim()){
      larotLog("erro no meio da fala, mas já tinha texto — processando mesmo assim");
      processAndReset();
      return;
    }
    if(e.error === "no-speech"){
      showToast("Não ouvi nada, tenta de novo.");
    } else if(e.error === "network"){
      showToast("Falha de conexão com o reconhecimento de voz. Tenta de novo.");
    }
    setListening(false);
    if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer = null; }
  });

  micBtn.addEventListener("click", function(){
    if(!window.LarotBridge || !window.LarotBridge.isReady()){
      showToast("Faça login primeiro.");
      return;
    }
    if(listening){
      // toca de novo pra encerrar e processar antes do silêncio automático
      finishListening();
      return;
    }
    micBtn.classList.remove("paused");
    finalChunks = "";
    setListening(true);
    showToast("Ouvindo... (toca de novo quando terminar de falar)", 0);
    larotLog("iniciando escuta (recognition.start)");
    try{
      recognition.start();
    }catch(e){
      larotLog("erro ao chamar start(): " + e);
      setListening(false);
    }
  });
})();
</script>
</body>
</html>
